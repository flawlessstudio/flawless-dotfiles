name: Generate mise lockfile

on:
  push:
    branches:
      - feat/reproducible-agent-environment-v0.1
    paths:
      - mise.toml
      - mise.*.toml
      - .miserc.toml
      - .github/workflows/lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Resolve cross-platform tool lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve lockfile
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export MISE_TRUSTED_CONFIG_PATHS="$GITHUB_WORKSPACE"
          mise lock --platform linux-x64,windows-x64,macos-x64,macos-arm64
          test -s mise.lock
          mise lock --platform linux-x64,windows-x64,macos-x64,macos-arm64
          git diff -- mise.lock || true

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mise-lock
          path: mise.lock
          if-no-files-found: error
          retention-days: 7
